import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale
import java.util.TimeZone

// Horodatage calé sur UTC+3 (Exemple : 23052026-14H22)
def getBuildTimestamp() {
    def date = new Date()
    def formattedDate = new SimpleDateFormat("ddMMyyyy-HH'H'mm", Locale.FRANCE)
    formattedDate.setTimeZone(TimeZone.getTimeZone("GMT+3"))
    return formattedDate.format(date)
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tradingbot.analyzer'
    compileSdk 34

    defaultConfig {
        applicationId "com.tradingbot.analyzer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Nom de fichier : Fonda_IOF_V1.0.1_23052026-14H22.apk
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def timestamp = getBuildTimestamp()
            def vName = variant.versionName
            def vCode = variant.versionCode
            outputFileName = "Fonda_IOF_V${vName}.${vCode}_${timestamp}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.json:json:20231013'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
