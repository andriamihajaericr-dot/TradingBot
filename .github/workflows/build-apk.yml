name: Build Trading Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Crée la variable de date pour GitHub (même format qu'avant : JJMMAAAA-HHHMM)
      - name: Generate Build Date for GitHub
        id: date
        run: echo "CURRENT_DATE=$(date +'%d%m%Y-%HH%M')" >> $GITHUB_ENV

      # Gradle 8.1.1 + cache des dépendances activé (évite de retélécharger à chaque build)
      - name: Install & Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'
          cache-read-only: false

      # Cache de la base SQLite du bot (inchangé)
      - name: Restaurer la base de données SQLite du Bot
        uses: actions/cache@v4
        with:
          path: |
            **/databases/trading_bot.db
            **/databases/trading_bot.db-shm
            **/databases/trading_bot.db-wal
          key: trading-bot-db-${{ github.sha }}
          restore-keys: |
            trading-bot-db-

      # Compilation avec relance automatique en cas d'erreur réseau (429 notamment)
      - name: Build Debug APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 120
          command: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Début fixe "V1.0.1" pour correspondre au build.gradle, suivi de la date dynamique
          name: Fonda_IOF_V1.0.1_${{ env.CURRENT_DATE }}
          path: app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
